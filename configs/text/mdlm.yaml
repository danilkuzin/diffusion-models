run_name: text_mdlm_baseline
data:
  type: shakespeare
  batch_size: 64
  seq_len: 256
  train_frac: 0.9
model:
  type: text_dit
  embed_dim: 384
  depth: 6
  heads: 6
  mlp_ratio: 4.0
  dropout: 0.0
  time_cond: true
objective:
  type: mdlm
  t_min: 0.001
train:
  steps: 30000
  lr: 1e-3
  warmup_steps: 200
  min_lr_frac: 0.1
  weight_decay: 0.1
  beta2: 0.99
  grad_clip: 1.0
  seed: 0
eval:
  every: 500
  K: 8
log:
  ckpt_every: 2000
