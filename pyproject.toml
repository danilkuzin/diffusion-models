[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes (unused imports/vars, undefined names)
    "I",   # isort (import sorting)
    "UP",  # pyupgrade (modernize syntax for target-version)
    "B",   # flake8-bugbear (common bug patterns, e.g. mutable defaults)
]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
ignore_missing_imports = true
strict = true
